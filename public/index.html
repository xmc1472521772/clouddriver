<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☁️ 我的云盘</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
</head>
<body>
  <!-- ==================== 登录页 ==================== -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-icon">☁️</div>
      <h1>我的云盘</h1>
      <p class="login-subtitle">私人云存储空间</p>
      <form id="loginForm" class="login-form">
        <div class="input-group">
          <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">登 录</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- ==================== 主应用 ==================== -->
  <div id="appPage" class="app-page" style="display:none;">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">☁️ 我的云盘</span>
      </div>
      <div class="topbar-center">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索文件...">
        </div>
      </div>
      <div class="topbar-right">
        <div class="storage-info" id="storageInfo" title="存储空间">
          <div class="storage-bar-container">
            <div class="storage-bar" id="storageBar" style="width:0%"></div>
          </div>
          <span class="storage-text" id="storageText">0 MB / 10 GB</span>
        </div>
        <button class="btn-icon" id="logoutBtn" title="退出登录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-item" data-path="">全部文件</span>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn-secondary" id="newFolderBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          新建文件夹
        </button>
        <button class="btn-secondary" id="uploadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          上传文件
        </button>
      </div>
      <div class="toolbar-right">
        <span class="file-count" id="fileCount"></span>
      </div>
    </div>

    <!-- 拖拽上传区域 -->
    <div class="drop-zone" id="dropZone">
      <!-- 文件列表 -->
      <div class="file-list" id="fileList">
        <!-- 文件项动态生成 -->
      </div>
      
      <!-- 空状态 -->
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">📂</div>
        <p>这个文件夹是空的</p>
        <p class="empty-hint">拖拽文件到此处或点击上传按钮</p>
      </div>
    </div>

    <!-- 上传进度列表 -->
    <div class="upload-progress-list" id="uploadProgressList"></div>
  </div>

  <!-- 隐藏的文件选择器 -->
  <input type="file" id="fileInput" multiple style="display:none;">

  <!-- ==================== 新建文件夹弹窗 ==================== -->
  <div class="modal-overlay" id="folderModal" style="display:none;">
    <div class="modal">
      <h3>新建文件夹</h3>
      <input type="text" id="folderNameInput" placeholder="文件夹名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeFolderModal()">取消</button>
        <button class="btn-primary" id="confirmFolderBtn">创建</button>
      </div>
    </div>
  </div>

  <!-- ==================== 重命名弹窗 ==================== -->
  <div class="modal-overlay" id="renameModal" style="display:none;">
    <div class="modal">
      <h3>重命名</h3>
      <input type="text" id="renameInput" placeholder="新名称" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRenameModal()">取消</button>
        <button class="btn-primary" id="confirmRenameBtn">确定</button>
      </div>
    </div>
  </div>

  <!-- ==================== 右键菜单 ==================== -->
  <div class="context-menu" id="contextMenu" style="display:none;">
    <div class="context-menu-item" id="ctxDownload">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载
    </div>
    <div class="context-menu-item" id="ctxRename">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      重命名
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item context-menu-danger" id="ctxDelete">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除
    </div>
  </div>

  <!-- ==================== Toast 提示 ==================== -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
